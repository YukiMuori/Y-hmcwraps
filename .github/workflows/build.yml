name: Build and test

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Gradle build, tests, and plugin JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Verify distributable JAR
        run: test -s build/libs/HMCWraps-2.0.0.jar

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HMCWraps-${{ github.sha }}
          path: build/libs/HMCWraps-*.jar
          if-no-files-found: error
          retention-days: 30
