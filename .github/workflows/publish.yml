name: Publish to Hibiscus Repository

on:
  push:
    branches:
      - master

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'dependabot') && !contains(github.event.head_commit.message, 'nopush')"
    environment: build
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.REPO_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Build with Gradle
        run: chmod +x ./gradlew && ./gradlew clean build --no-daemon --stacktrace

      - name: Publish to Nexus
        if: ${{ env.HAS_TOKEN == 'true' }}
        run: ./gradlew api:publishMavenPublicationToHibiscusMCRepository
        env:
          REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
          REPO_PASSWORD: ${{ secrets.REPO_PASSWORD }}
