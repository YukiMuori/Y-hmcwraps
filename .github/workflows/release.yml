name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, test, and create a draft release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and ensure it is on master
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version tag such as v2.0.0; got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Refusing to release: the tag must point to a commit on master." >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew --no-daemon clean build

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          mapfile -t jars < <(
            find . -type f \
              -path '*/build/libs/HMCWraps-*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print | sort
          )

          jar_path=""
          for candidate in "${jars[@]}"; do
            if [[ "$(basename "$candidate")" == "HMCWraps-${version}.jar" ]]; then
              jar_path="$candidate"
              break
            fi
          done

          if [[ -z "$jar_path" ]]; then
            echo "Expected HMCWraps-${version}.jar was not produced by the build." >&2
            printf 'JARs found:\\n%s\\n' "${jars[*]:-none}"
            exit 1
          fi

          mkdir -p release-assets
          cp "$jar_path" "release-assets/HMCWraps-${version}.jar"
          cp docs/MIGRATION-2.0.md release-assets/MIGRATION-2.0.md
          (
            cd release-assets
            sha256sum "HMCWraps-${version}.jar" > SHA256SUMS
          )

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Y-HMCWraps ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/HMCWraps-*.jar
            release-assets/MIGRATION-2.0.md
            release-assets/SHA256SUMS
