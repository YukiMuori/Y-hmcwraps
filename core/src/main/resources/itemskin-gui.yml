# Every visible control can be disabled, moved and given a custom material or hooked item.
# All titles, names and lore use MiniMessage. Skin icons and controls also accept item-model and tooltip-style.
gui:
  title: '<gradient:#8FEAF9:#CDA4F9>ɪᴛᴇᴍ sᴋɪɴs</gradient>'
  size: 54
  content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  # The selected item is also the single browser-control button:
  # left click cycles sorting and right click cycles filters.
  item-enabled: true
  item-slot: 4
  # Fully configurable display name for the selected-item control.
  # Supports <item_name>, <sort>, <filter>, MiniMessage, and language tags.
  item-name: '<gradient:#8FEAF9:#CDA4F9><lang:gui.item-control-title></gradient>'
  # <item_lore> expands the item's original lore when included. Every line may be changed or removed.
  item-lore:
    - '<gray><lang:gui.item-control-description></gray>'
    - ''
    - '<gray><lang:gui.item-control-selected> <item_name></gray>'
    - ''
    - '<#FFE89A><lang:gui.item-control-sort></#FFE89A> <gray><sort></gray>'
    - '<#8FEAF9><lang:gui.item-control-filter></#8FEAF9> <gray><filter></gray>'
  default-sort: rarity
  default-sort-order: descending
  show-locked: true
  # Lore shown on every skin icon. The default is intentionally minimal and uses exactly the
  # lore from that skin's file. Add, remove or reorder any line here as desired.
  # Available placeholders: <skin_lore> (standalone, expands to all skin lore lines), <skin>,
  # <rarity>, <status>, <price> and <currency>. MiniMessage and <lang:...> work too.
  skin-lore:
    - '<skin_lore>'
  filler-enabled: false
  filler:
    type: material
    id: BLACK_STAINED_GLASS_PANE
    name: ' '
    hide-tooltip: true
  shop:
    enabled: false
    slot: 7
    item:
      type: material
      id: EMERALD
      name: '<gradient:#8FEAF9:#CDA4F9><lang:gui.shop></gradient>'
      lore:
        - ''
        - '<#F0FAFF><lang:gui.shop-description></#F0FAFF>'
        - ''
        - '<#FFE89A>➜ <lang:gui.click-shop></#FFE89A>'
  previous:
    enabled: true
    slot: 45
    item:
      type: material
      id: ARROW
      name: '<gray>← <lang:gui.previous></gray>'
      lore:
        - ''
        - '<#F0FAFF><lang:gui.previous-description></#F0FAFF>'
        - ''
        - '<#FFE89A>➜ <lang:gui.click-navigate></#FFE89A>'
  search:
    enabled: false
    slot: 46
    item:
      type: material
      id: SPYGLASS
      name: '<gradient:#8FEAF9:#CDA4F9><lang:gui.search></gradient>'
      lore:
        - ''
        - '<#F0FAFF><lang:gui.search-description></#F0FAFF>'
        - ''
        - '<#FFE89A>➜ <lang:gui.click-search></#FFE89A>'
  collection:
    enabled: false
    slot: 48
    item:
      type: material
      id: BOOK
      name: '<#CDA4F9><lang:gui.collection></#CDA4F9>'
      lore:
        - ''
        - '<#F0FAFF><lang:gui.collection-description></#F0FAFF>'
        - ''
        - '<#FFE89A>➜ <lang:gui.click-change></#FFE89A>'
  unskin:
    enabled: true
    slot: 49
    item:
      type: material
      id: SHEARS
      name: '<#FF6B6B>✕ <lang:gui.unskin></#FF6B6B>'
      lore:
        - ''
        - '<#F0FAFF><lang:gui.unskin-description></#F0FAFF>'
        - ''
        - '<#FFE89A>➜ <lang:gui.click-unskin></#FFE89A>'
  close:
    enabled: false
    slot: 49
    item:
      type: material
      id: BARRIER
      name: '<#FF6B6B>✕ <lang:gui.close></#FF6B6B>'
      lore:
        - ''
        - '<gray><lang:gui.close-description></gray>'
  sort:
    enabled: false
    slot: 51
    item:
      type: material
      id: COMPARATOR
      name: '<#FFE89A><lang:gui.sort></#FFE89A>'
      lore:
        - ''
        - '<#F0FAFF><lang:gui.sort-description></#F0FAFF>'
        - ''
        - '<#FFE89A>➜ <lang:gui.click-change></#FFE89A>'
  filter:
    enabled: false
    slot: 52
    item:
      type: material
      id: HOPPER
      name: '<#8FEAF9><lang:gui.filter></#8FEAF9>'
      lore:
        - ''
        - '<#F0FAFF><lang:gui.filter-description></#F0FAFF>'
        - ''
        - '<#FFE89A>➜ <lang:gui.click-change></#FFE89A>'
  next:
    enabled: true
    slot: 53
    item:
      type: material
      id: ARROW
      name: '<#8FEAF9><lang:gui.next> →</#8FEAF9>'
      lore:
        - ''
        - '<#F0FAFF><lang:gui.next-description></#F0FAFF>'
        - ''
        - '<#FFE89A>➜ <lang:gui.click-navigate></#FFE89A>'
  # DeluxeMenus-style category controls. Every category has its own state, slot and complete item.
  categories:
    swords:
      enabled: true
      slot: 38
      item:
        type: material
        id: DIAMOND_SWORD
        name: '<gray><lang:categories.swords></gray>'
        lore: ['<gray><lang:gui.category-description></gray>']
    pickaxes:
      enabled: true
      slot: 39
      item:
        type: material
        id: DIAMOND_PICKAXE
        name: '<gray><lang:categories.pickaxes></gray>'
        lore: ['<gray><lang:gui.category-description></gray>']
    axes:
      enabled: true
      slot: 40
      item:
        type: material
        id: DIAMOND_AXE
        name: '<gray><lang:categories.axes></gray>'
        lore: ['<gray><lang:gui.category-description></gray>']
    armor:
      enabled: true
      slot: 41
      item:
        type: material
        id: DIAMOND_CHESTPLATE
        name: '<gray><lang:categories.armor></gray>'
        lore: ['<gray><lang:gui.category-description></gray>']
    tools:
      enabled: true
      slot: 42
      item:
        type: material
        id: COMPASS
        name: '<gray><lang:categories.tools></gray>'
        lore: ['<gray><lang:gui.category-description></gray>']
  click-actions:
    left: apply
    right: preview
    shift-left: buy
    shift-right: buy
sorting:
  options: [rarity, name, price, owned, category]
filters:
  options: [all, owned, unowned, purchasable, free]
