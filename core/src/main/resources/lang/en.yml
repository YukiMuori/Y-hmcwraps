# Legacy wraps/commands plus shared diagnostics. All message text can be edited here.
legacy:
  no-permission: '<red>Insufficient permission!'
  no-permission-for-wrap: '<red>You don''t have permission to use this wrap!'
  apply-wrap: '<gray>Successfully <green>applied <gray>the wrap to the item!'
  remove-wrap: '<gray>Successfully <red>removed <gray>your current wrap!'
  no-item: '<red>You need to have an item in your main hand!'
  no-item-selected: '<red>You need to select an item first!'
  no-wraps: '<red>There are no wraps for this item!'
  no-rewrap: '<red>You have to unwrap this item before you can wrap it!'
  preview:
    disabled: '<red>You can''t preview this wrap!'
    bar: '<green>Press <key:key.sneak> to cancel the preview'
  favorites:
    set: '<gray>You have successfully <green>set <gray>your favorite wrap!'
    unset: '<gray>You have successfully <red>removed <gray>this wrap from your favorites!'
    clear: '<gray>You have successfully <green>cleared <gray>all favorite wraps!'
  armor-imitation:
    forbidden-inventory: '<red>You can''t use this with a wrapped item! Please unwrap it first.'
  inventory:
    filter:
      active: '<gray>Filtering <green>enabled!'
      inactive: '<gray>Filtering <red>disabled!'
  command:
    missing-argument: '<red>You have to specify the <argument>!'
    invalid-wrap: '<red><uuid> <gray>is not a valid wrap UUID!'
    invalid-physical: '<red><uuid> <gray>doesn''t have a valid physical item configured!'
    given-physical: '<gray>Successfully gave the <green><uuid> wrapper!'
    given-unwrapper: '<gray>Successfully gave the <green>unwrapper!'
    invalid-world: '<red><world> <gray>is not a valid world!'
    invalid-player: '<red><player> <gray>is not an online player!'
    dropped-physical: '<gray>Successfully dropped the <green><uuid> <gray>wrapper!'
    reload: '<green>Successfully reloaded <gray>the plugin in <green><time>ms! <newline><gray>(Loaded <green><wraps> wraps <gray>and <green><collections> collections<gray>)'
    player-only: '<red>You have to be a player to execute this command!'
    need-item: '<red>The player has to have an item in their main hand!'
    item-not-for-wrap: '<red>The wrap you have chosen does not apply to the one the player is holding!'
    item-not-wrapped: '<red>The item the player is holding is not wrapped!'
    wrap:
      wrapped: '<gray>Successfully <green>wrapped <gray>the <green>item!'
    unwrap:
      unwrapped: '<gray>Successfully <red>unwrapped <gray>the <green>item!'
    no-matching-item: '<red>There is no item applicable to this wrap!'
    preview-created: '<gray>Successfully <green>created <gray>the <green>preview!'
    help:
      header: '<gray>=======\> <green>HMCWraps commands <gray>\<======='
      format: '<green>/<command> <gray>- <description>'
      no-permission: '<red>There are no commands available at your permission level.'
    list:
      header: '<gray>=======\> <green>HMCWraps wraps <gray>\<======='
      collections: '<green>Collections:'
      wraps: '<green>Wraps:'
      key-format: '<gray>  <value>:'
      collections-format: '<gray>    - <green><value>'
      wraps-format: '<gray>    <hover:show_text:"<gray>Permission: <green><permission><newline><gray>Model ID: <green><modelid><newline><gray>Click to apply to current item">- <click:run_command:/wraps wrap <value>><green><value>'
      permission: '<gray>Permission: <green><permission>'
      custom-model-id: '<gray>Model ID: <green><modelid>'
    convert:
      success: '<gray>Successfully <green>converted <gray>all <green>ItemSkins files! <gray>The new files are located in <green>wraps/generated/ <gray>and <green>collections/generated/!'
      confirm: '<gray>In order to <green>confirm <gray>this action, please run <green>/wraps convert confirm. <gray>NOTE: <red>This should be safe, but please have a backup of your files!'
      no-confirm: '<red>You currently don''t have anything to confirm! <gray>In order to start the process, run <red>/wraps convert.'
      failed: '<red>Some or all files failed to convert! <gray>Please <red>check <gray>the console for more information, <red>delete <gray>the folders <red>wraps/generated/ <gray>and <red>collections/generated/, and <red>try again!'
    create:
      failed: '<red>An error occurred while generating the wrap file! Please report the error in the console to the developers.'
      success: '<gray>Successfully <green>created <gray>the <green>wrap <gray>file! You can find it at: <green><path>! <gray>Type <green>/wraps reload <gray>once you want the new wrap to be loaded.'
    open: '<gray>Successfully <green>opened <gray>the wraps inventory for <green><player>!'
  placeholder:
    equipped: '<green>Equipped'
    not-equipped: '<red>Not equipped'
    favorite: '<green>Favorite'
    not-favorite: '<red>Not favorite'
    has-permission: '<green>Yes'
    no-permission: '<red>No'
    invalid-wrap: '<red>Invalid wrap!'

