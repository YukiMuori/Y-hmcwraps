# Descriptions used by /wraps help, keyed by the command path.
command-descriptions:
  wraps:
    root: 'Open the wraps inventory.'
    open: 'Open the wraps inventory for another player.'
    reload: 'Reload configuration and messages.'
    convert: 'Convert ItemSkins files to HMCWraps files.'
    wrap: 'Wrap the item the player is holding in their main hand.'
    unwrap: 'Unwrap the item a player is holding in their main hand.'
    preview: 'Preview a wrap for the specified player.'
    give:
      wrapper: 'Give a wrapper to a player.'
      unwrapper: 'Give an unwrapper to a player.'
    drop: 'Drop a wrapper at the specified location.'
    list: 'Shows all wraps and collections configured.'
    help: 'Shows the help page.'
    create: 'Create a wrap from an item in hand!'
  itemskin:
    root: 'Open the item-skin catalog for the item in your main hand.'
    open: 'Open the item-skin catalog for the item in your main hand.'
    remove: 'Remove the current v2 skin from the item in your main hand.'
    preview: 'Preview a configured skin on the item in your main hand.'

updates:
  available: '<gray>There is a new version of <green><bold>HMCWraps</bold></green> available!<newline><gray>Current version: <red>{current}</red> | Latest version: <green>{latest}</green><newline><gray>Download it on <gold><hover:show_text:"<blue>Click to open!"><click:open_url:{spigot_url}>SpigotMC</gold> or <gold><hover:show_text:"<blue>Click to open!"><click:open_url:{polymart_url}>Polymart</gold>!'
