// Re-reports Java compiler diagnostics as GitHub Actions check annotations.
//
// Why: the raw job log lives on a storage host that is not reachable from every network, while the
// checks API always is. Workflow commands written to the console become annotations, so this script
// runs the JDK compiler once before the real compile task and prints every error as
// `::error file=...,line=...::message`.
//
// Applied from the root build script to every subproject and only in CI. Every step is wrapped in
// try/catch: diagnostics must never be able to break a build.

println "::notice::ci-annotations applied to ${project.name}"

try {
    def javaExtension = project.extensions.getByType(org.gradle.api.plugins.JavaPluginExtension)
    def mainSourceSet = javaExtension.sourceSets.getByName('main')
    def compileTask = project.tasks.named('compileJava', org.gradle.api.tasks.compile.JavaCompile)

    // Resolved eagerly so the task action only closes over plain data.
    def sources = mainSourceSet.allJava.files.toList()
    def classpath = mainSourceSet.compileClasspath.files.toList()
    def release = compileTask.get().options.release.orNull ?: 21
    def moduleName = project.name

    def preflight = project.tasks.register('preflightCompile') {
        group = 'verification'
        description = 'Re-reports compile errors as GitHub check annotations (CI only).'
        doLast {
            println "::notice::preflightCompile ran for ${moduleName} (${sources.size()} sources)"
            try {
                def compiler = javax.tools.ToolProvider.systemJavaCompiler
                if (compiler == null) {
                    println "::warning::no system java compiler available for ${moduleName}"
                    return
                }
                def diagnostics = new javax.tools.DiagnosticCollector()
                compiler.getStandardFileManager(diagnostics, null, java.nio.charset.StandardCharsets.UTF_8).withCloseable { fileManager ->
                    def units = fileManager.getJavaFileObjectsFromFiles(sources)
                    def options = ['--release', release.toString(), '-parameters', '-encoding', 'UTF-8', '-proc:none']
                    def output = new java.io.StringWriter()
                    compiler.getTask(output, fileManager, diagnostics, options, null, units).call()
                }
                def errors = diagnostics.diagnostics.findAll { it.kind == javax.tools.Diagnostic.Kind.ERROR }
                if (errors.isEmpty()) {
                    println "::notice::preflightCompile found no errors in ${moduleName}"
                    return
                }
                println "::error::${errors.size()} compile error(s) in ${moduleName}."
                errors.take(50).each { diagnostic ->
                    def absolute = diagnostic.source?.toUri()?.path ?: '<unknown>'
                    def relative = absolute
                    try {
                        relative = project.rootDir.toPath().relativize(java.nio.file.Path.of(absolute)).toString()
                    } catch (Throwable ignored) {
                        // Keep the absolute path when it is outside the repository.
                    }
                    def message = (diagnostic.getMessage(null) ?: 'compile error')
                            .replace('%', '%25').replace('\n', ' ').replace('\r', '')
                    def line = diagnostic.lineNumber > 0 ? diagnostic.lineNumber : 1
                    println "::error file=${relative},line=${line},title=Compile error::${moduleName}: ${message}"
                }
            } catch (Throwable throwable) {
                println "::warning::preflight compile diagnostics failed for ${moduleName}: ${throwable}"
            }
        }
    }

    compileTask.configure { dependsOn(preflight) }
} catch (Throwable throwable) {
    println "::error::Could not register the CI compile diagnostics for ${project.name}: ${throwable}"
}
